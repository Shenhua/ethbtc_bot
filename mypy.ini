[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = False
# Start with lenient settings - can tighten later
check_untyped_defs = True
ignore_missing_imports = True

# Strict settings for new modules
[mypy-core.resilience]
disallow_untyped_defs = True

[mypy-core.risk_manager]
disallow_untyped_defs = True

[mypy-core.order_manager]
disallow_untyped_defs = True

# Exclude legacy modules for now
[mypy-tests.*]
ignore_errors = True
