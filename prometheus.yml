global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'ethbtc_bot'
    honor_labels: true  # Preserve bot's instance label
    static_configs:
      - targets: ['bot_eth:9109']

  - job_name: 'btcusdt_bot'
    honor_labels: true  # Preserve bot's instance label
    static_configs:
      - targets: ['bot_btc:9109']

